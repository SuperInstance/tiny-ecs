[package]
name = "super-tiny-ecs"
version = "0.1.0"
edition = "2021"
description = "Minimal archetype-based Entity-Component-System in Rust — zero external dependencies, zero unsafe, zero allocation in hot paths"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
rand = "0.8"
serde_json = "1.0"
